<text x="400.0" y="138.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">写路径</text>
<text x="400.0" y="153.6" text-anchor="middle" font-size="10" fill="#6b7280">upsert unit / edge / lineage / episode（append-only 三表）</text>
<text x="400.0" y="194.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">读路径</text>
<text x="400.0" y="209.6" text-anchor="middle" font-size="10" fill="#6b7280">hybrid search / 图遍历 / 时间旅行查询</text>
<text x="400.0" y="250.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">部分索引 bw_current_idx</text>
<text x="400.0" y="265.6" text-anchor="middle" font-size="10" fill="#6b7280">"当前为真"最高频谓词，不让每次召回扫全表</text>
<text x="400.0" y="306.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">派生视图 bw_current_truth</text>
<text x="400.0" y="321.6" text-anchor="middle" font-size="10" fill="#6b7280">valid_to IS NULL AND superseded_by IS NULL AND state=ACTIVE</text>
<text x="400.0" y="362.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">namespace 租户隔离</text>
<text x="400.0" y="377.6" text-anchor="middle" font-size="10" fill="#6b7280">scope_path 前缀匹配 + tenant 过滤</text>
<text x="800" y="112" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">索引实现（skylark-index · 4 实现）</text>
