<text x="1070.0" y="265.4" text-anchor="middle" font-size="10" fill="#6b7280">bw_unit_edge · 图遍历 + 时间旅行</text>
<text x="1070.0" y="302.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">RepositoryPort</text>
<text x="1070.0" y="317.4" text-anchor="middle" font-size="10" fill="#6b7280">PG 元数据（Flyway 建表）</text>
<text x="1070.0" y="354.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ObjectStorePort</text>
<text x="1070.0" y="369.4" text-anchor="middle" font-size="10" fill="#6b7280">大对象 / 原文 / md（对象存储）</text>
<text x="800" y="412" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">物理存储</text>
<text x="900" y="494.1" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">PostgreSQL</text>
<text x="900" y="510.9" text-anchor="middle" font-size="10.5" fill="#6b7280">pgvector · Flyway</text>
<text x="1080" y="494.1" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">对象存储</text>
<text x="1080" y="510.9" text-anchor="middle" font-size="10.5" fill="#6b7280">原文 / md</text>
<text x="990" y="594.1" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">ES / Milvus</text>
<text x="990" y="610.9" text-anchor="middle" font-size="10.5" fill="#6b7280">词法 · 向量（可选）</text>
<text x="560" y="638" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">地基阶段不引入 Neo4j：图先做关系表 + 递归 CTE，量级证明需要再换；</text>
<text x="560" y="655" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">store 不可用 fail-fast，禁止静默降级为内存实现。</text>
