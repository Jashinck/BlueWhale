<text x="1070.0" y="198.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">BM25Index</text>
<text x="1070.0" y="213.4" text-anchor="middle" font-size="10" fill="#6b7280">PG tsvector / ES · 词法</text>
