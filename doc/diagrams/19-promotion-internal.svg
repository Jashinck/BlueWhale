<marker id="arrow-ink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#111827"/></marker>
<filter id="soft" x="-20%%" y="-20%%" width="140%%" height="140%%"><feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="40" y="42" font-size="19" font-weight="700" fill="#111827">知识工程⇄记忆工程 晋升桥 · 内部架构</text>
<text x="40" y="64" font-size="12.5" fill="#6b7280">晋升五步判定链（任一 NO 即留在记忆工程）+ 降权/冷启动旁路 + 人审/双模型互检闸门</text>
<rect x="40" y="84" width="1120" height="660" rx="12" ry="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.55"/>
<text x="54" y="106" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.4">晋升桥模块</text>
