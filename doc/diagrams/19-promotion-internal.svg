<ellipse cx="1000" cy="412" rx="75.0" ry="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="340.0" y="138.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">输入 · DISTILLED 单元</text>
<text x="340.0" y="153.6" text-anchor="middle" font-size="10" fill="#6b7280">来自记忆工程蒸馏产物</text>
<text x="340.0" y="198.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">检查证据是否充分</text>
<text x="340.0" y="213.6" text-anchor="middle" font-size="10" fill="#6b7280">lineage / provenance / extractorVersion 完整可回溯</text>
<text x="340.0" y="262.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">检查能否跨主体泛化</text>
<text x="340.0" y="277.6" text-anchor="middle" font-size="10" fill="#6b7280">≥N 个 agent/user 反复召回（非单一会话偶然）</text>
<text x="340.0" y="326.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">检查采纳率是否超过阈值</text>
<text x="340.0" y="341.6" text-anchor="middle" font-size="10" fill="#6b7280">nAdopted / nSeen 达标（bw_usage_event 归因）</text>
<text x="340.0" y="390.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">检查纠正率是否低于阈值</text>
<text x="340.0" y="405.6" text-anchor="middle" font-size="10" fill="#6b7280">nCorrected / nSeen 低于红线（超则走降权）</text>
<text x="340.0" y="454.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">ReviewGate · 治理闸门</text>
<text x="340.0" y="469.6" text-anchor="middle" font-size="10" fill="#6b7280">人审 / 双模型互检 → 带 authority 发布</text>
<text x="340.0" y="514.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">输出 · 候选知识单元</text>
<text x="340.0" y="529.6" text-anchor="middle" font-size="10" fill="#6b7280">origin=DISTILLED, scope=project/workspace</text>
<text x="720" y="112" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">旁路（非晋升正门）</text>
<text x="930.0" y="150.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">DemotionTrigger</text>
<text x="930.0" y="165.4" text-anchor="middle" font-size="10" fill="#6b7280">频繁纠正/命中冲突/源变更 → STALE_SUSPECT（只降权不删）</text>
<text x="930.0" y="214.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">BootstrapLinker</text>
<text x="930.0" y="229.4" text-anchor="middle" font-size="10" fill="#6b7280">知识库实体/本体挂载点 → 实体链接（无治理负担）</text>
<text x="720" y="272" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">存储</text>
<text x="800" y="358.4" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_context_unit</text>
<text x="1000" y="358.4" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_unit_edge</text>
<text x="800" y="438.4" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_usage_event</text>
<text x="1000" y="438.3" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111827">bw_lifecycle_event</text>
<text x="420" y="612" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">所有动作 append-only 写 bw_lifecycle_event；</text>
<text x="420" y="629" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">未经 ReviewGate 的 DISTILLED 单元不得进入 ACTIVE。</text>
<rect x="60" y="596" width="264" height="94" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="72" y="614" font-size="11" font-weight="600" fill="#6b7280">图例</text>
<line x1="74" y1="628" x2="100" y2="628" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-main)"/>
<text x="108" y="632.0" font-size="11" fill="#111827">判定链流转</text>
<line x1="74" y1="648" x2="100" y2="648" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-ctrl)"/>
<text x="108" y="652.0" font-size="11" fill="#111827">发布</text>
<line x1="74" y1="668" x2="100" y2="668" stroke="#0d9488" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
<text x="108" y="672.0" font-size="11" fill="#111827">旁路/降权（异步）</text>
</svg>