<path d="M 620.0,394.0 L 690.0,394.0 L 690.0,154.0 L 720.0,154.0" fill="none" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-teal)" stroke-linejoin="round"/>
<path d="M 620.0,458.0 L 690.0,458.0 L 690.0,345.0 L 725.0,345.0" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrow-ctrl)" stroke-linejoin="round"/>
<text x="698" y="270" text-anchor="end" font-size="9.5" font-weight="500" fill="#0d9488">纠正率检查未通过 → 降权</text>
<text x="698" y="408" text-anchor="end" font-size="9.5" font-weight="500" fill="#ea580c">发布</text>
