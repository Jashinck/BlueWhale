<rect width="1400" height="1000" fill="#ffffff"/>
<text x="40" y="42" font-size="19" font-weight="700" fill="#111827">知识工程 · 内部架构</text>
<text x="40" y="64" font-size="12.5" fill="#6b7280">七阶段知识处理流程 + Distill 萃取子包 + 横切（本体校验/血缘/传播/变更单闸门）+ 端口 + 存储；写路径异步，所有写入经 ChangeRequest</text>
