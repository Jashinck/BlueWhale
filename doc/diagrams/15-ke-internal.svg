<line x1="294" y1="862" x2="320" y2="862" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>
<text x="328" y="866.0" font-size="11" fill="#111827">端口实现</text>
<line x1="294" y1="882" x2="320" y2="882" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-ctrl)"/>
<text x="328" y="886.0" font-size="11" fill="#111827">萃取 → 变更单草稿</text>
