<text x="400.0" y="138.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">输入 · SourceRef</text>
<text x="400.0" y="153.6" text-anchor="middle" font-size="10" fill="#6b7280">外部 URI · 上传 · 代码库快照（经 SsrfGuard + SecretResolver）</text>
<text x="400.0" y="198.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">Ingest · 接入</text>
<text x="400.0" y="213.6" text-anchor="middle" font-size="10" fill="#6b7280">登记 bw_source，生成 CAPTURED 单元</text>
<text x="400.0" y="262.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">Parser · 解析</text>
<text x="400.0" y="277.6" text-anchor="middle" font-size="10" fill="#6b7280">按 MIME 策略 → 结构化文档（标题树/表格/代码块）</text>
<text x="400.0" y="326.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">Segmenter · 分段</text>
<text x="400.0" y="341.6" text-anchor="middle" font-size="10" fill="#6b7280">SegTree + 摘要/概览（轻量模型）</text>
<text x="400.0" y="390.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">Extractor · 抽取</text>
<text x="400.0" y="405.6" text-anchor="middle" font-size="10" fill="#6b7280">抽取/嵌入模型输出 WikiPatch（md diff）· claim 标注源文/推导/专家/复盘 · 源文级逐字校验</text>
<text x="400.0" y="454.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">Normalizer · 规范化</text>
<text x="400.0" y="469.6" text-anchor="middle" font-size="10" fill="#6b7280">先合并后新增 · 实体链接 · 新类型进 PROPOSED 队列 · ontologyVersion</text>
<text x="400.0" y="518.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">Reconciler · 调和</text>
<text x="400.0" y="533.6" text-anchor="middle" font-size="10" fill="#6b7280">bi-temporal 写边 · 冲突≠覆盖 · 同属性（binds_property）跨页冲突检查</text>
<text x="400.0" y="582.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">Publisher · 发布</text>
<text x="400.0" y="597.6" text-anchor="middle" font-size="10" fill="#6b7280">提交 ChangeRequest → 审核 → 回归闸门 → 批次 ATOMIC/CANARY/ROLLBACK</text>
<text x="400.0" y="642.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">增量回流 · PropagationJob</text>
<text x="400.0" y="657.6" text-anchor="middle" font-size="10" fill="#6b7280">源变更 → needsReextract 子树重算（非全量重抽）</text>
<text x="60" y="692" text-anchor="start" font-size="12" font-weight="600" fill="#111827">distill 子包（闭环：使用信号 → 归因 → 变更单草稿，author=SYSTEM 不得自批）</text>
<text x="135.0" y="727.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">SignalCollector</text>
<text x="135.0" y="742.4" text-anchor="middle" font-size="10" fill="#6b7280">收集 bw_signal</text>
<text x="310.0" y="727.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Attributor</text>
<text x="310.0" y="742.4" text-anchor="middle" font-size="10" fill="#6b7280">按七类归因码定位</text>
<text x="485.0" y="727.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Clusterer</text>
<text x="485.0" y="742.4" text-anchor="middle" font-size="10" fill="#6b7280">按（对象, 归因码）</text>
<text x="660.0" y="727.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">DraftWriter</text>
<text x="660.0" y="742.4" text-anchor="middle" font-size="10" fill="#6b7280">生成变更单草稿</text>
<text x="800" y="112" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">横切组件</text>
<text x="1070.0" y="146.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">OntologyValidator</text>
<text x="1070.0" y="161.4" text-anchor="middle" font-size="10" fill="#6b7280">schema + evidenceSpan 校验；本体不得自扩</text>
<text x="1070.0" y="198.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">LineageTracker</text>
<text x="1070.0" y="213.4" text-anchor="middle" font-size="10" fill="#6b7280">source→segment→claim 血缘 + needsReextract 标记</text>
<text x="1070.0" y="250.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">PropagationTrigger</text>
<text x="1070.0" y="265.4" text-anchor="middle" font-size="10" fill="#6b7280">源变更事件 → 触发增量重算</text>
<text x="1070.0" y="302.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ChangeRequestGate + PublishBatchRepository</text>
<text x="1070.0" y="317.4" text-anchor="middle" font-size="10" fill="#6b7280">变更单状态机 · 回归闸门 · 批次 ATOMIC/CANARY/ROLLBACK</text>
<text x="800" y="356" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">端口（SPI，定义于 domain）</text>
<text x="930.0" y="390.8" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ExtractionPort</text>
<text x="930.0" y="405.0" text-anchor="middle" font-size="9.5" fill="#6b7280">抽取、蒸馏与重排</text>
<text x="1215.0" y="390.8" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">EmbeddingPort</text>
<text x="1215.0" y="405.0" text-anchor="middle" font-size="9.5" fill="#6b7280">向量化（抽取/嵌入模型）</text>
<text x="930.0" y="444.8" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ObjectStorePort</text>
<text x="930.0" y="459.0" text-anchor="middle" font-size="9.5" fill="#6b7280">大对象 / 原文 / md</text>
<text x="1215.0" y="444.8" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">IndexPort</text>
<text x="1215.0" y="459.0" text-anchor="middle" font-size="9.5" fill="#6b7280">HNSW/BM25/图 写入</text>
<text x="800" y="500" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">存储（PostgreSQL + pgvector + 对象存储）</text>
<text x="900" y="586.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_source</text>
<text x="1080" y="586.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_segment</text>
<text x="900" y="666.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_context_unit</text>
<text x="1080" y="666.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_unit_edge</text>
<text x="900" y="746.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_lineage</text>
<text x="1080" y="746.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_publish_batch</text>
<text x="900" y="826.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_change_request</text>
<text x="1080" y="826.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_signal</text>
<text x="560" y="848" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">写路径异步：解析、分段与抽取经抽取 worker 池执行，幂等键 (sourceId, segmentId, extractorVersion)；</text>
<text x="560" y="865" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">调和与发布走批量去抖；失败整批回滚，不留半态。</text>
<rect x="60" y="830" width="464" height="94" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="72" y="848" font-size="11" font-weight="600" fill="#6b7280">图例</text>
