<text x="600" y="104.1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">触发：retentionUntil 到期 / 合规请求（被遗忘权）/ 制度废止</text>
<text x="600.0" y="156.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">定位目标 unit 集合</text>
<text x="600.0" y="170.9" text-anchor="middle" font-size="9.5" fill="#6b7280">读 bw_lineage 找出下游派生（蒸馏/汇总）</text>
<text x="600" y="231.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">存在 legal hold?</text>
<text x="600" y="245.5" text-anchor="middle" font-size="9" fill="#6b7280">诉讼/审计冻结优先于一切擦除</text>
<text x="1010.0" y="228.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">冻结退场 → ARCHIVED</text>
<text x="1010.0" y="242.9" text-anchor="middle" font-size="9.5" fill="#6b7280">不擦除 · 留证 · 待 hold 解除</text>
<text x="600.0" y="308.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">计算级联范围</text>
<text x="600.0" y="322.9" text-anchor="middle" font-size="9.5" fill="#6b7280">embeddings · 摘要/概览 目录项 · 三索引条目 · 派生蒸馏产物</text>
<text x="600" y="387.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">级联清单确认?</text>
<text x="600" y="401.5" text-anchor="middle" font-size="9" fill="#6b7280">治理 job 自动 / 高风险人工</text>
<text x="210.0" y="384.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">挂起</text>
<text x="210.0" y="398.9" text-anchor="middle" font-size="9.5" fill="#6b7280">→ 人工复核级联范围</text>
<text x="600.0" y="460.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">写 bw_erasure 审计行</text>
<text x="600.0" y="474.9" text-anchor="middle" font-size="9.5" fill="#6b7280">删了什么 · 依据 · 时间 · 执行者 · 级联清单 · 残留说明</text>
<text x="600.0" y="520.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">置墓碑</text>
<text x="600.0" y="534.9" text-anchor="middle" font-size="9.5" fill="#6b7280">unit 行保留 id + erasedAt + reason，其余字段置空</text>
<text x="600.0" y="580.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">删索引条目</text>
<text x="600.0" y="594.9" text-anchor="middle" font-size="9.5" fill="#6b7280">向量 HNSW · BM25 · 图边；清 摘要/概览 目录项</text>
<text x="600.0" y="640.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">级联处理派生产物</text>
<text x="600.0" y="654.9" text-anchor="middle" font-size="9.5" fill="#6b7280">下游蒸馏 unit 标记 stale / 触发重算</text>
<text x="600" y="717.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">验证通过?</text>
<text x="600" y="731.5" text-anchor="middle" font-size="9" fill="#6b7280">召回返回空 · 墓碑可查 · 级联无残留</text>
<text x="210.0" y="714.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">回滚 / 告警</text>
<text x="210.0" y="728.9" text-anchor="middle" font-size="9.5" fill="#6b7280">→ 人工介入</text>
<text x="600" y="796.1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">ERASED（不可逆）· 仅留墓碑 + bw_erasure 审计行</text>
<text x="60" y="836" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">三不变式之一：默认软失效；硬删只能由本流程触发，且必须留墓碑（§14.6）。legal hold 优先于擦除与保留期。</text>
<text x="60" y="853" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">md 源文件是否删除取决于源保留策略（Git 历史默认保留）；bw_erasure 只记录「系统内」擦除范围与残留说明。</text>
