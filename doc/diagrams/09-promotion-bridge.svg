<text x="640" y="104.1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">记忆工程 巩固·蒸馏 产出蒸馏产物（跨 episode 归纳）</text>
<text x="640" y="165.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">晋升门槛?</text>
<text x="640" y="179.5" text-anchor="middle" font-size="9" fill="#6b7280">频次≥N · 跨 episode 一致 · conf≥θ</text>
<text x="240.0" y="162.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">留在 记忆工程</text>
<text x="240.0" y="176.9" text-anchor="middle" font-size="9.5" fill="#6b7280">kind=MEMORY 继续衰减/巩固</text>
<text x="640.0" y="230.8" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">生成晋升候选</text>
<text x="640.0" y="245.0" text-anchor="middle" font-size="9.5" fill="#6b7280">origin=DISTILLED + lineage 指向源 episodes</text>
<text x="640.0" y="286.8" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">知识工程 侧接收</text>
<text x="640.0" y="301.0" text-anchor="middle" font-size="9.5" fill="#6b7280">进入 抽取 / 规范化（作为候选 unit）</text>
<text x="640" y="357.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">可溯源?</text>
<text x="640" y="371.5" text-anchor="middle" font-size="9" fill="#6b7280">有 evidenceSpan · 可回指源文档</text>
<text x="240.0" y="354.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">QUARANTINED</text>
<text x="240.0" y="368.9" text-anchor="middle" font-size="9.5" fill="#6b7280">无溯源 → 人工修复或丢弃</text>
<text x="640" y="437.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">与现有 知识工程 unit 冲突?</text>
<text x="640" y="451.5" text-anchor="middle" font-size="9" fill="#6b7280">调和引擎检 CONTRADICTS</text>
<text x="1070.0" y="434.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">CONFLICTED</text>
<text x="1070.0" y="448.9" text-anchor="middle" font-size="9.5" fill="#6b7280">成对返回 + 人审裁决</text>
<text x="640.0" y="502.8" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">审核闸门</text>
<text x="640.0" y="517.0" text-anchor="middle" font-size="9.5" fill="#6b7280">origin=DISTILLED → PENDING_REVIEW（SLA ≤ 3 工作日）</text>
<text x="640" y="578.1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">人审 / 双模型互检 通过?</text>
<text x="240.0" y="570.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">驳回</text>
<text x="240.0" y="584.9" text-anchor="middle" font-size="9.5" fill="#6b7280">→ QUARANTINED / 丢弃</text>
<text x="640" y="654.1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">validFrom &gt; now?</text>
<text x="1070.0" y="646.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">SCHEDULED</text>
<text x="1070.0" y="660.9" text-anchor="middle" font-size="9.5" fill="#6b7280">定时 job 到点 → ACTIVE</text>
<text x="640.0" y="712.8" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ACTIVE（可召回）</text>
<text x="640.0" y="727.0" text-anchor="middle" font-size="9.5" fill="#6b7280">写 bw_lifecycle_event（append-only）</text>
<text x="640.0" y="768.8" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">记忆工程 侧原 memory 处置</text>
<text x="640.0" y="783.0" text-anchor="middle" font-size="9.5" fill="#6b7280">supersededBy 指向新 unit / Demotion 降权</text>
<text x="1262" y="118" text-anchor="start" font-size="11" font-weight="600" fill="#6b7280">旁路（非晋升正门）</text>
<text x="1365.0" y="155.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Demotion 降级</text>
<text x="1365.0" y="169.0" text-anchor="middle" font-size="9" fill="#6b7280">知识工程 unit 长期零使用 /</text>
<text x="1365.0" y="182.5" text-anchor="middle" font-size="9" fill="#6b7280">纠正超阈 → 降回 记忆工程</text>
<text x="1365.0" y="196.0" text-anchor="middle" font-size="9" fill="#6b7280">kind=MEMORY 重新巩固</text>
<text x="1365.0" y="273.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Bootstrap 冷启动</text>
<text x="1365.0" y="287.0" text-anchor="middle" font-size="9" fill="#6b7280">全新领域无 知识工程 时，</text>
<text x="1365.0" y="300.5" text-anchor="middle" font-size="9" fill="#6b7280">记忆工程 蒸馏直接搭</text>
<text x="1365.0" y="314.0" text-anchor="middle" font-size="9" fill="#6b7280">知识工程 骨架（低 conf）</text>
<text x="60" y="812" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">晋升是「记忆→知识」的唯一写入路径：蒸馏产物必须过门槛 + 溯源 + 冲突 + 审核四道闸，不直接写 ACTIVE。</text>
<text x="60" y="829" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">每次晋升/降级都写 bw_lifecycle_event 与 bw_lineage（候选←源 episodes），保证可回放、可回滚。</text>
</svg>