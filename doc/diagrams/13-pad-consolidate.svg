<text x="320.0" y="109.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">输入</text>
<text x="320.0" y="123.9" text-anchor="middle" font-size="9.5" fill="#6b7280">MaintenanceTrigger(trigger, scope, jobRunId)</text>
<text x="320.0" y="165.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">SEL  按触发源分派 job</text>
<text x="320.0" y="179.9" text-anchor="middle" font-size="9.5" fill="#6b7280">三 job 独立调度 / 独立重入，不用一个用例全包</text>
<text x="400.0" y="219.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">ConsolidationJob</text>
<text x="400.0" y="233.3" text-anchor="middle" font-size="9" fill="#6b7280">定时 或 相似簇规模达阈值</text>
<text x="400.0" y="267.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">DecayJob</text>
<text x="400.0" y="281.3" text-anchor="middle" font-size="9" fill="#6b7280">高频定时（每日），只算不删</text>
<text x="400.0" y="315.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">ReflectionJob</text>
<text x="400.0" y="329.3" text-anchor="middle" font-size="9" fill="#6b7280">会话 / 任务结束事件驱动</text>
<text x="320.0" y="373.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">LOOP  每个候选簇（巩固·蒸馏）</text>
<text x="320.0" y="387.9" text-anchor="middle" font-size="9.5" fill="#6b7280">相似聚类 → 判定可否抽象 → 蒸馏 → 挂血缘</text>
<text x="400.0" y="429.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">相似聚类 + 去重合并</text>
<text x="400.0" y="443.3" text-anchor="middle" font-size="9" fill="#6b7280">向量近邻 ∧ 同 entity ∧ 同 scope 才可合并（MERGE 边）</text>
<text x="400.0" y="485.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">SEL  簇内能否抽象为更高层语义？</text>
<text x="400.0" y="499.3" text-anchor="middle" font-size="9" fill="#6b7280">证据是否充分、是否跨 ≥N 个 episode 重复出现</text>
<text x="460.0" y="539.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">NO</text>
<text x="460.0" y="553.3" text-anchor="middle" font-size="9" fill="#6b7280">仅合并，不造新单元（宁缺勿滥，堵幻觉抽象）</text>
<text x="460.0" y="589.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">YES</text>
<text x="460.0" y="603.3" text-anchor="middle" font-size="9" fill="#6b7280">模型蒸馏（推理模型 + 结构化输出）→ 新建 DISTILLED 单元</text>
<text x="400.0" y="649.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">挂 DERIVED_FROM 边 + lineage.parents</text>
<text x="400.0" y="663.3" text-anchor="middle" font-size="9" fill="#6b7280">原单元保留并降权，不删（软失效）；产物必带 provenance</text>
<text x="320.0" y="711.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">LOOP  每个可衰减单元（衰减·强化）</text>
<text x="320.0" y="725.9" text-anchor="middle" font-size="9.5" fill="#6b7280">salience 计算 → 类型豁免 → 分档处置</text>
<text x="400.0" y="767.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111827">salience = f(importance, Δt, nSeen, nCited, nAdopted, nCorrected)</text>
<text x="400.0" y="781.2" text-anchor="middle" font-size="9" fill="#6b7280">采纳提权 / 纠正降权：行为改变记忆强度，而非仅访问时间</text>
<text x="400.0" y="823.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">SEL  kind == PROCEDURAL / SKILL？</text>
<text x="400.0" y="837.3" text-anchor="middle" font-size="9" fill="#6b7280">程序性记忆是"学会的"，不是"记住的"</text>
<text x="460.0" y="877.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">YES</text>
<text x="460.0" y="891.3" text-anchor="middle" font-size="9" fill="#6b7280">只降权，永不遗忘（保留既有正确决策）</text>
<text x="460.0" y="928.0" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111827">NO</text>
<text x="460.0" y="940.8" text-anchor="middle" font-size="8.5" fill="#6b7280">高档→强化提权 / 中档→保持 / 低档→STALE_SUSPECT / 极低且保留期到→退场候选</text>
<text x="320.0" y="989.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">LOOP  每条采纳 / 纠正信号（复盘·回写）</text>
<text x="320.0" y="1003.9" text-anchor="middle" font-size="9.5" fill="#6b7280">计数回写 → 超阈降权 → 反思产出技能</text>
<text x="400.0" y="1045.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111827">recordApplied(ADOPTED | CORRECTED) → economy 计数</text>
<text x="400.0" y="1059.2" text-anchor="middle" font-size="9" fill="#6b7280">纠正率超阈 → Demotion(STALE_SUSPECT) 或送 reconcile，不直接删</text>
<text x="400.0" y="1103.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">轨迹反思 → 产出程序性记忆（SKILL）</text>
<text x="400.0" y="1117.3" text-anchor="middle" font-size="9" fill="#6b7280">提交 BlueWhale 走晋升闸门（人审），不在 Langur 侧自存</text>
<text x="320.0" y="1165.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">输出</text>
<text x="320.0" y="1179.9" text-anchor="middle" font-size="9.5" fill="#6b7280">MaintenanceReport + 每条决策 append-only 写 bw_lifecycle_event</text>
<text x="1020.0" y="129.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">蒸馏 ≠ 摘要拼接</text>
<text x="1020.0" y="144.4" text-anchor="middle" font-size="10" fill="#6b7280">聚类先行：不同 entity / 不同 scope 的经验不可混蒸</text>
<text x="1020.0" y="159.4" text-anchor="middle" font-size="10" fill="#6b7280">蒸馏产物是新的 ContextUnit，带 provenance 与 extractorVersion</text>
<text x="1020.0" y="174.4" text-anchor="middle" font-size="10" fill="#6b7280">原件保留 + DERIVED_FROM 可回溯到"哪几段输入产生的"</text>
<text x="1020.0" y="253.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">衰减的输入是信号，不是时间</text>
<text x="1020.0" y="268.4" text-anchor="middle" font-size="10" fill="#6b7280">仅 exp(-decay·天) 是伪闭环：无"被采纳/被纠正"即断链</text>
<text x="1020.0" y="283.4" text-anchor="middle" font-size="10" fill="#6b7280">importance 不再由 accessCount&gt;3 硬编码，改由 economy 驱动</text>
<text x="1020.0" y="298.4" text-anchor="middle" font-size="10" fill="#6b7280">衰减只改 salience / state，从不物理删除</text>
<text x="1020.0" y="370.9" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">两条不可违背的纪律</text>
<text x="1020.0" y="385.9" text-anchor="middle" font-size="10" fill="#6b7280">巩固不删原件：软失效 + 墓碑，冲突≠覆盖</text>
<text x="1020.0" y="400.9" text-anchor="middle" font-size="10" fill="#6b7280">程序性记忆不参与遗忘：技能只降权</text>
<text x="1020.0" y="473.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">幂等与失败域隔离</text>
<text x="1020.0" y="488.4" text-anchor="middle" font-size="10" fill="#6b7280">幂等键 (jobRunId, unitId)，重跑不重复计数、不重复产物</text>
<text x="1020.0" y="503.4" text-anchor="middle" font-size="10" fill="#6b7280">单 job 失败不影响其余 job，更不影响同步读路径</text>
<text x="1020.0" y="518.4" text-anchor="middle" font-size="10" fill="#6b7280">维护全程异步，禁止阻塞 resolve()</text>
<text x="1020.0" y="590.9" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">可观测产出（无它则不可调参）</text>
<text x="1020.0" y="605.9" text-anchor="middle" font-size="10" fill="#6b7280">合并数 / 蒸馏数 / 强化数 / 降权数 / 退场候选数</text>
<text x="1020.0" y="620.9" text-anchor="middle" font-size="10" fill="#6b7280">每条处置写 lifecycle event，可按 unit 回放前后状态</text>
<text x="760" y="676" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">维护是写路径的"新陈代谢"：缺了它，记忆只增不减、只堆不炼，</text>
<text x="760" y="693" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">召回质量随规模单调劣化，成本账也永远算不清。</text>
<text x="760" y="710" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">退场候选不等于删除——是否销毁由 知识工程 侧受控销毁流程裁决</text>
<text x="760" y="727" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">（legal hold 优先，见 10-erasure-flow）。</text>
</svg>