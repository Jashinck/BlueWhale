<text x="40" y="42" font-size="19" font-weight="700" fill="#111827">PAD 图 · 巩固 / 衰减 / 复盘维护算法</text>
<text x="40" y="64" font-size="12.5" fill="#6b7280">三 job 失败域隔离且各自幂等；蒸馏保留原件并挂 DERIVED_FROM；衰减由采纳/纠正信号驱动，不只看时间</text>
