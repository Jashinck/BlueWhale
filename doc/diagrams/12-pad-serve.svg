<text x="320.0" y="114.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">输入</text>
<text x="320.0" y="128.9" text-anchor="middle" font-size="9.5" fill="#6b7280">resolve(query, scope栈, budget, mode)</text>
<text x="320.0" y="174.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">权限前置</text>
<text x="320.0" y="188.9" text-anchor="middle" font-size="9.5" fill="#6b7280">可见域 = scope ∩ AccessPolicy（召回前过滤，非召回后）</text>
<text x="320.0" y="234.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">SEL  意图门控</text>
<text x="320.0" y="248.9" text-anchor="middle" font-size="9.5" fill="#6b7280">规则 + 轻量模型（0 LLM）：要不要检索？选择事件时间线、实体关系图还是精炼文档层？</text>
<text x="400.0" y="292.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">NO / 证据不足 / 权限不足</text>
<text x="400.0" y="306.3" text-anchor="middle" font-size="9" fill="#6b7280">→ EMPTY + 原因码（早退，不凑数注入）</text>
<text x="400.0" y="342.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">YES</text>
<text x="400.0" y="356.3" text-anchor="middle" font-size="9" fill="#6b7280">→ 进入多路召回</text>
<text x="320.0" y="404.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">LOOP  每条召回线并发</text>
<text x="320.0" y="418.9" text-anchor="middle" font-size="9.5" fill="#6b7280">dense(HNSW) / BM25 / 图遍历</text>
<text x="400.0" y="462.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">取候选 + 分数</text>
<text x="400.0" y="476.3" text-anchor="middle" font-size="9" fill="#6b7280">bi-temporal 过滤：仅 ACTIVE / STALE(降权) / CONFLICTED(成对)</text>
<text x="320.0" y="524.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">RRF 融合</text>
<text x="320.0" y="538.9" text-anchor="middle" font-size="9.5" fill="#6b7280">k=60，多路名次倒数融合</text>
<text x="320.0" y="584.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">重排</text>
<text x="320.0" y="598.9" text-anchor="middle" font-size="9.5" fill="#6b7280">cross-encoder(重排/调和模型) 或 向量+词面混合</text>
<text x="320.0" y="644.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">MMR 去冗</text>
<text x="320.0" y="658.9" text-anchor="middle" font-size="9.5" fill="#6b7280">λ 多样性，剔除高度重复候选</text>
<text x="320.0" y="704.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">SEL  预算分配</text>
<text x="320.0" y="718.9" text-anchor="middle" font-size="9.5" fill="#6b7280">CORE / ON_DEMAND 切分 + 深度决策</text>
<text x="400.0" y="762.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">budget=DETAIL / 多跳 explore</text>
<text x="400.0" y="776.3" text-anchor="middle" font-size="9" fill="#6b7280">→ 摘要→概览 按需展开（记 bw_usage_event，异步）</text>
<text x="400.0" y="806.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">否则</text>
<text x="400.0" y="820.3" text-anchor="middle" font-size="9" fill="#6b7280">→ 只装 摘要/概览（同步路径，p95&lt;300ms）</text>
<text x="320.0" y="858.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">组装 + 输出</text>
<text x="320.0" y="872.9" text-anchor="middle" font-size="9.5" fill="#6b7280">ContextBundle(items+level+citations+trace) 或 EMPTY</text>
<text x="1020.0" y="133.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">意图门控 = 规则 + 轻量模型（0 LLM）</text>
<text x="1020.0" y="148.4" text-anchor="middle" font-size="10" fill="#6b7280">查询类型判定：事实 / 程序 / 偏好 / 非检索承载</text>
<text x="1020.0" y="163.4" text-anchor="middle" font-size="10" fill="#6b7280">检索线选择：事件时间线、实体关系图、精炼文档层</text>
<text x="1020.0" y="178.4" text-anchor="middle" font-size="10" fill="#6b7280">置信不足 → EMPTY，不凑数（堵对抗类幻觉）</text>
<text x="1020.0" y="257.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">三预算装载</text>
<text x="1020.0" y="272.4" text-anchor="middle" font-size="10" fill="#6b7280">CORE：身份/任务，总是满载</text>
<text x="1020.0" y="287.4" text-anchor="middle" font-size="10" fill="#6b7280">ON_DEMAND：长期记忆/知识，按需加载</text>
<text x="1020.0" y="302.4" text-anchor="middle" font-size="10" fill="#6b7280">LEDGER：事件账本，只写不读（供再加工与审计）</text>
<text x="1020.0" y="374.9" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">EMPTY 是正确答案</text>
<text x="1020.0" y="389.9" text-anchor="middle" font-size="10" fill="#6b7280">证据不足 / 权限不足 / 冲突未决 → 空 + 原因码</text>
<text x="1020.0" y="404.9" text-anchor="middle" font-size="10" fill="#6b7280">CONFLICTED 单元成对返回，不单边裁决</text>
<text x="1020.0" y="478.9" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">trace 全链路可回放</text>
<text x="1020.0" y="493.9" text-anchor="middle" font-size="10" fill="#6b7280">门控判定 · 各路命中与分数 · 融合权重 · 重排分</text>
<text x="1020.0" y="508.9" text-anchor="middle" font-size="10" fill="#6b7280">MMR 选择 · 预算分配 · 摘要→概览 决策</text>
<text x="760" y="560" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">同步读路径 p95 &lt; 300ms，默认 0 次 LLM 调用；</text>
<text x="760" y="577" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">多跳 agentic 深检索 = 显式异步工具 explore/expand（记账）。</text>
<text x="760" y="594" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">无 trace 则归因与调参无从谈起，故 trace 为强制产出。</text>
</svg>