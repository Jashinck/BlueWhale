<text x="40" y="42" font-size="19" font-weight="700" fill="#111827">PAD 图 · 意图门控 + 多路融合排序（上下文供给）</text>
<text x="40" y="64" font-size="12.5" fill="#6b7280">默认 0 次 LLM 调用；EMPTY 是合法早退；预算决定 摘要→概览 展开；全链路 trace 可回放</text>
