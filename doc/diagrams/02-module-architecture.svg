<text x="40" y="42" font-size="19" font-weight="700" fill="#111827">BlueWhale — 模块架构图（Client 端 + Server 端 · 依赖方向 · 包内分层）</text>
<text x="40" y="64" font-size="12.5" fill="#6b7280">Server 为默认部署，内部沿用 Langur DDD；client 端 = Agent runtime + 管理端（独立应用，知识工程与管理端），非 BlueWhale Maven 模块</text>
