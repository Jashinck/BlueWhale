<text x="108" y="806.0" font-size="11" fill="#111827">编译依赖（depends on）</text>
<line x1="74" y1="822" x2="100" y2="822" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-data)"/>
<text x="108" y="826.0" font-size="11" fill="#111827">端口实现（依赖倒置）</text>
<line x1="74" y1="842" x2="100" y2="842" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>
<text x="108" y="846.0" font-size="11" fill="#111827">运行时 / 网络委托</text>
<line x1="74" y1="862" x2="100" y2="862" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-async)"/>
<text x="108" y="866.0" font-size="11" fill="#111827">装配注入（starter）</text>
</svg>