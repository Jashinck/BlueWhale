<rect x="820" y="414" width="400" height="44" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="220.0" y="122.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Langur Agent runtime</text>
<text x="220.0" y="137.4" text-anchor="middle" font-size="10" fill="#6b7280">SDK/DI · 消费 ContextBundle · recordFeedback</text>
<text x="560.0" y="122.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">管理端 · 独立 client 应用（知识工程与管理端）</text>
<text x="560.0" y="137.4" text-anchor="middle" font-size="10" fill="#6b7280">知识治理 · 记忆管理 · 生命周期看板</text>
<text x="860.0" y="122.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">第三方 / 跨语言消费者</text>
<text x="860.0" y="137.4" text-anchor="middle" font-size="10" fill="#6b7280">REST · MCP</text>
<text x="1110.0" y="122.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Embedded 库模式</text>
<text x="1110.0" y="137.4" text-anchor="middle" font-size="10" fill="#6b7280">单机测试 / 小规模（同进程 DI）</text>
<text x="60" y="168" text-anchor="start" font-size="13" font-weight="600" fill="#111827">Server 端 Maven 模块与编译依赖方向（箭头 = depends on）</text>
<text x="640.0" y="204.1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">bluewhale-starter —— Server 默认装配入口（REST + MCP + 管理端 API）；embedded 仅单机测试/小规模</text>
<text x="220.0" y="274.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">bluewhale-interfaces</text>
<text x="220.0" y="290.5" text-anchor="middle" font-size="11" fill="#6b7280">REST · MCP · 管理端 API · DTO</text>
<text x="570.0" y="274.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">bluewhale-client</text>
<text x="570.0" y="290.5" text-anchor="middle" font-size="11" fill="#6b7280">远程薄 SDK（Agent runtime 与 管理端共用）</text>
<text x="390.0" y="362.7" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">bluewhale-app</text>
<text x="390.0" y="377.7" text-anchor="middle" font-size="10" fill="#6b7280">Ingest/Capture/Resolve/Feedback/Maintenance/Govern + ChangeRequest 用例 · distill · 周期 job</text>
<text x="390.0" y="448.6" text-anchor="middle" font-size="13.5" font-weight="600" fill="#111827">bluewhale-core —— domain（零框架依赖）</text>
<text x="390.0" y="464.4" text-anchor="middle" font-size="10.5" fill="#6b7280">ContextUnit 聚合根 · UnitEdge 双时态图 · Lifecycle · Ownership · Lineage · ChangeRequest</text>
<text x="390.0" y="480.1" text-anchor="middle" font-size="10.5" fill="#6b7280">端口全部在此：IndexPort / RetrievalPort / ExtractionPort / EmbeddingPort / ObjectStorePort / ClockPort / PolicyPort</text>
<text x="160.0" y="554.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">bluewhale-index-adapter</text>
<text x="160.0" y="569.2" text-anchor="middle" font-size="10" fill="#6b7280">IndexPort → skylark-index</text>
<text x="385.0" y="554.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">bluewhale-store-postgres</text>
<text x="385.0" y="569.2" text-anchor="middle" font-size="10" fill="#6b7280">元数据 + pgvector + Flyway</text>
<text x="615.0" y="554.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">bluewhale-extract</text>
<text x="615.0" y="569.2" text-anchor="middle" font-size="10" fill="#6b7280">ExtractionPort → 抽取、重排和推理模型</text>
<text x="160.0" y="642.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">skylark-index（共享库）</text>
<text x="160.0" y="657.2" text-anchor="middle" font-size="10" fill="#6b7280">9 端口 · 4 实现 · RRF</text>
<text x="385" y="652.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">PostgreSQL + pgvector</text>
<text x="385" y="668.5" text-anchor="middle" font-size="10" fill="#6b7280">HNSW · 事件/血缘/审核表</text>
<text x="615.0" y="642.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Langur LlmGateway</text>
<text x="615.0" y="657.2" text-anchor="middle" font-size="10" fill="#6b7280">模型矩阵统一出口</text>
<text x="60" y="700" text-anchor="start" font-size="11" font-weight="400" fill="#6b7280">依赖倒置：core 只定义端口，三个 adapter 实现端口；app 不 import 任何 infrastructure 包</text>
<text x="60" y="718" text-anchor="start" font-size="11" font-weight="400" fill="#6b7280">现状缺陷修复：MemoryDomainService 反向 import infrastructure.embedding/vectorstore → 端口下沉 domain</text>
<text x="1020.0" y="240.3" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">interfaces 包 —— REST / MCP / 管理端 API / DTO 转换</text>
<text x="1020.0" y="300.3" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">application 包 —— 用例编排 · 事务边界 · 事件发布</text>
<text x="1020.0" y="360.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">domain 包 —— 聚合根 · 状态机 · 领域服务 · 端口</text>
<text x="1020.0" y="375.4" text-anchor="middle" font-size="10" fill="#6b7280">context / knowledge / memory / graph / lifecycle / governance / feedback / port</text>
<text x="1020.0" y="440.3" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">infrastructure 包 —— 端口实现（store / index / extract / mcp / rest）</text>
<text x="820" y="540" text-anchor="start" font-size="11" font-weight="400" fill="#111827">· domain 零框架依赖：禁 import spring / infra / 第三方 SDK</text>
<text x="820" y="561" text-anchor="start" font-size="11" font-weight="400" fill="#111827">· application 只依赖 domain 端口，禁直接 new 适配器</text>
<text x="820" y="582" text-anchor="start" font-size="11" font-weight="400" fill="#111827">· interfaces 只做 DTO 转换与参数校验，禁含业务规则</text>
<text x="820" y="603" text-anchor="start" font-size="11" font-weight="400" fill="#111827">· SecretResolver 取密钥，密钥永不落日志；SsrfGuard 校验外部 URI</text>
<text x="820" y="624" text-anchor="start" font-size="11" font-weight="400" fill="#111827">· namespace 强制租户隔离；嵌入维度一致性启动 fail-fast</text>
<text x="820" y="645" text-anchor="start" font-size="11" font-weight="400" fill="#111827">· store 不可用 fail-fast，禁止静默降级为内存实现</text>
<text x="820" y="666" text-anchor="start" font-size="11" font-weight="400" fill="#111827">· 权限在召回前生效（不把不该见的摘要送进排序器）</text>
<text x="820" y="687" text-anchor="start" font-size="11" font-weight="400" fill="#111827">· 检索内容按不可信输入处理：trust tier + quarantine 两道闸</text>
<text x="820" y="708" text-anchor="start" font-size="11" font-weight="400" fill="#111827">· 写入统一经 ChangeRequest；写路径异步，读路径默认 0 次 LLM</text>
<rect x="60" y="770" width="324" height="114" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="72" y="788" font-size="11" font-weight="600" fill="#6b7280">图例</text>
