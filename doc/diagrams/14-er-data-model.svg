<text x="610" y="107.5" font-size="12" font-weight="700" fill="#111827" class="mono">bw_context_unit</text>
<text x="610" y="130" font-size="9.5" fill="#6b7280" class="mono">id UUID  PK</text>
<text x="610" y="145" font-size="9.5" fill="#6b7280" class="mono">tenant · scope_path（前缀匹配作用域）</text>
<text x="610" y="160" font-size="9.5" fill="#6b7280" class="mono">kind · origin · state</text>
<text x="610" y="175" font-size="9.5" fill="#6b7280" class="mono">l0_abstract / l1_overview / l2_inline / l2_ref</text>
<text x="610" y="190" font-size="9.5" fill="#6b7280" class="mono">confidence · authority · importance</text>
<text x="610" y="205" font-size="9.5" fill="#6b7280" class="mono">valid_from / valid_to 现实轴 · learned_at 系统轴</text>
<text x="610" y="220" font-size="9.5" fill="#6b7280" class="mono">source_published_at / captured_at 采集轴</text>
<text x="610" y="235" font-size="9.5" fill="#6b7280" class="mono">review_due_at / retention_until / erased_at 治理轴</text>
<text x="610" y="250" font-size="9.5" fill="#6b7280" class="mono">superseded_by → bw_context_unit.id</text>
<text x="610" y="265" font-size="9.5" fill="#6b7280" class="mono">cost_tokens · n_seen · n_cited · n_adopted · n_corrected</text>
<text x="610" y="280" font-size="9.5" fill="#6b7280" class="mono">embedding vector(1536) HNSW · metadata JSONB GIN</text>
<text x="610" y="295" font-size="9.5" fill="#6b7280" class="mono">ontology_version · batch_id → bw_publish_batch.id</text>
<text x="150" y="107.5" font-size="12" font-weight="700" fill="#111827" class="mono">bw_episode</text>
<text x="150" y="130" font-size="9.5" fill="#6b7280" class="mono">id UUID  PK</text>
<text x="150" y="145" font-size="9.5" fill="#6b7280" class="mono">tenant · scope_path</text>
<text x="150" y="160" font-size="9.5" fill="#6b7280" class="mono">occurred_at · source</text>
<text x="150" y="175" font-size="9.5" fill="#6b7280" class="mono">payload JSONB</text>
<text x="150" y="190" font-size="9.5" fill="#6b7280" class="mono">只增不改（LEDGER 预算，供再加工与审计）</text>
<text x="150" y="247.5" font-size="12" font-weight="700" fill="#111827" class="mono">bw_segment</text>
<text x="150" y="270" font-size="9.5" fill="#6b7280" class="mono">id UUID  PK</text>
<text x="150" y="285" font-size="9.5" fill="#6b7280" class="mono">doc_id · parent_id（目录树自引用）</text>
<text x="150" y="300" font-size="9.5" fill="#6b7280" class="mono">ordinal · path</text>
<text x="150" y="315" font-size="9.5" fill="#6b7280" class="mono">abstract · overview</text>
<text x="150" y="330" font-size="9.5" fill="#6b7280" class="mono">content_ref</text>
<text x="150" y="345" font-size="9.5" fill="#6b7280" class="mono">层级 = 摘要/概览/原文 三级表征的结构前提</text>
<text x="150" y="401.5" font-size="12" font-weight="700" fill="#111827" class="mono">bw_lineage</text>
<text x="150" y="424" font-size="9.5" fill="#6b7280" class="mono">parent_id + child_id + derivation  PK</text>
<text x="150" y="439" font-size="9.5" fill="#6b7280" class="mono">derivation: PARSED | SEGMENTED |</text>
<text x="150" y="454" font-size="9.5" fill="#6b7280" class="mono">    EXTRACTED | DISTILLED | SKILLIZED</text>
<text x="150" y="469" font-size="9.5" fill="#6b7280" class="mono">derived_at · extractor_version · ontology_version</text>
<text x="150" y="484" font-size="9.5" fill="#6b7280" class="mono">needs_reextract BOOLEAN</text>
<text x="150" y="499" font-size="9.5" fill="#6b7280" class="mono">变更传播与影响分析的前提</text>
<text x="150" y="555.5" font-size="12" font-weight="700" fill="#111827" class="mono">bw_usage_event</text>
<text x="150" y="578" font-size="9.5" fill="#6b7280" class="mono">id BIGSERIAL  PK</text>
<text x="150" y="593" font-size="9.5" fill="#6b7280" class="mono">unit_id → bw_context_unit.id</text>
<text x="150" y="608" font-size="9.5" fill="#6b7280" class="mono">trace_id · event · at</text>
<text x="150" y="623" font-size="9.5" fill="#6b7280" class="mono">tokens · outcome</text>
<text x="150" y="638" font-size="9.5" fill="#6b7280" class="mono">append-only，归因与成本账原料</text>
<text x="150" y="695.5" font-size="12" font-weight="700" fill="#111827" class="mono">bw_review</text>
<text x="150" y="718" font-size="9.5" fill="#6b7280" class="mono">id UUID  PK</text>
<text x="150" y="733" font-size="9.5" fill="#6b7280" class="mono">unit_id → bw_context_unit.id</text>
<text x="150" y="748" font-size="9.5" fill="#6b7280" class="mono">gate · status</text>
<text x="150" y="763" font-size="9.5" fill="#6b7280" class="mono">reviewer · at</text>
<text x="150" y="778" font-size="9.5" fill="#6b7280" class="mono">note（晋升 / 废弃闸门留痕）</text>
<text x="1170" y="107.5" font-size="12" font-weight="700" fill="#111827" class="mono">bw_unit_edge</text>
<text x="1170" y="130" font-size="9.5" fill="#6b7280" class="mono">from_id + to_id + edge_type + valid_from  PK</text>
<text x="1170" y="145" font-size="9.5" fill="#6b7280" class="mono">edge_type: SUPPORTS / CONTRADICTS /</text>
<text x="1170" y="160" font-size="9.5" fill="#6b7280" class="mono">    SUPERSEDES / DERIVED_FROM / ABOUT …</text>
<text x="1170" y="175" font-size="9.5" fill="#6b7280" class="mono">valid_from / valid_to（双时态边）· weight</text>
<text x="1170" y="190" font-size="9.5" fill="#6b7280" class="mono">冲突调和的落点，时间旅行的依据</text>
<text x="1170" y="247.5" font-size="12" font-weight="700" fill="#111827" class="mono">bw_lifecycle_event</text>
<text x="1170" y="270" font-size="9.5" fill="#6b7280" class="mono">id BIGSERIAL  PK</text>
<text x="1170" y="285" font-size="9.5" fill="#6b7280" class="mono">unit_id → bw_context_unit.id</text>
<text x="1170" y="300" font-size="9.5" fill="#6b7280" class="mono">from_state · to_state · trigger</text>
<text x="1170" y="315" font-size="9.5" fill="#6b7280" class="mono">actor · at · reason</text>
<text x="1170" y="330" font-size="9.5" fill="#6b7280" class="mono">batch_id → bw_publish_batch.id</text>
<text x="1170" y="345" font-size="9.5" fill="#6b7280" class="mono">append-only，状态机的可执行证据</text>
<text x="1170" y="401.5" font-size="12" font-weight="700" fill="#111827" class="mono">bw_asset</text>
<text x="1170" y="424" font-size="9.5" fill="#6b7280" class="mono">unit_id  PK → bw_context_unit.id（1:1）</text>
<text x="1170" y="439" font-size="9.5" fill="#6b7280" class="mono">owner_id · owner_org</text>
<text x="1170" y="454" font-size="9.5" fill="#6b7280" class="mono">review_cycle_days · review_due_at · reviewed_at</text>
<text x="1170" y="469" font-size="9.5" fill="#6b7280" class="mono">retention_until</text>
<text x="1170" y="484" font-size="9.5" fill="#6b7280" class="mono">legal_hold · hold_reason（优先于擦除）</text>
<text x="1170" y="541.5" font-size="12" font-weight="700" fill="#111827" class="mono">bw_erasure</text>
<text x="1170" y="564" font-size="9.5" fill="#6b7280" class="mono">id UUID  PK</text>
<text x="1170" y="579" font-size="9.5" fill="#6b7280" class="mono">unit_id → bw_context_unit.id</text>
<text x="1170" y="594" font-size="9.5" fill="#6b7280" class="mono">request_type · legal_basis</text>
<text x="1170" y="609" font-size="9.5" fill="#6b7280" class="mono">requested_by · executed_at</text>
<text x="1170" y="624" font-size="9.5" fill="#6b7280" class="mono">cascade JSONB · residual_note（墓碑）</text>
<text x="1170" y="681.5" font-size="12" font-weight="700" fill="#111827" class="mono">bw_publish_batch</text>
<text x="1170" y="704" font-size="9.5" fill="#6b7280" class="mono">id UUID  PK</text>
<text x="1170" y="719" font-size="9.5" fill="#6b7280" class="mono">ontology_version · scope_filter</text>
<text x="1170" y="734" font-size="9.5" fill="#6b7280" class="mono">mode: ATOMIC | CANARY | ROLLBACK</text>
<text x="1170" y="749" font-size="9.5" fill="#6b7280" class="mono">status · effective_at</text>
<text x="1170" y="764" font-size="9.5" fill="#6b7280" class="mono">created_by</text>
<text x="630" y="877.5" font-size="12" font-weight="700" fill="#111827" class="mono">VIEW bw_current_truth</text>
<text x="630" y="900" font-size="9.5" fill="#6b7280" class="mono">SELECT * FROM bw_context_unit</text>
<text x="630" y="915" font-size="9.5" fill="#6b7280" class="mono">WHERE valid_to IS NULL AND superseded_by IS NULL</text>
<text x="630" y="930" font-size="9.5" fill="#6b7280" class="mono">  AND state = 'ACTIVE'</text>
<text x="60" y="860" text-anchor="start" font-size="10" font-weight="400" fill="#6b7280">append-only 三表只增不改：状态机、归因、审计的可执行证据；</text>
<text x="60" y="877" text-anchor="start" font-size="10" font-weight="400" fill="#6b7280">bw_unit_edge 双时态：调和写新边 + valid_to，不覆盖旧边；</text>
<text x="60" y="894" text-anchor="start" font-size="10" font-weight="400" fill="#6b7280">图遍历先做递归 CTE，地基阶段 不引入 Neo4j；三索引：HNSW + BM25 + 边表；</text>
<text x="60" y="911" text-anchor="start" font-size="10" font-weight="400" fill="#6b7280">"当前为真"走部分索引，不让每次召回扫全表；</text>
<text x="60" y="928" text-anchor="start" font-size="10" font-weight="400" fill="#6b7280">bw_source DDL 随 地基阶段 补齐；生命周期五表必须一次建齐。</text>
