<text x="190.0" y="141.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">CAPTURED</text>
<text x="190.0" y="156.6" text-anchor="middle" font-size="10" fill="#6b7280">原始信号/文档已登记</text>
<text x="430.0" y="141.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">EXTRACTED</text>
<text x="430.0" y="156.6" text-anchor="middle" font-size="10" fill="#6b7280">候选 unit 已抽出未校验</text>
<text x="705.0" y="141.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">QUARANTINED</text>
<text x="705.0" y="156.6" text-anchor="middle" font-size="10" fill="#6b7280">校验失败/无溯源/疑似注入</text>
<text x="185.0" y="291.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">SHADOW</text>
<text x="185.0" y="306.6" text-anchor="middle" font-size="10" fill="#6b7280">重抽战役·只参与评测</text>
<text x="435.0" y="291.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">PENDING_REVIEW</text>
<text x="435.0" y="306.6" text-anchor="middle" font-size="10" fill="#6b7280">待人审/双模型互检</text>
<text x="700.0" y="291.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">SCHEDULED</text>
<text x="700.0" y="306.6" text-anchor="middle" font-size="10" fill="#6b7280">已批准·未到 validFrom</text>
<text x="960.0" y="291.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">ACTIVE</text>
<text x="960.0" y="306.6" text-anchor="middle" font-size="10" fill="#6b7280">现行有效 · 默认进召回</text>
<text x="705.0" y="441.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">STALE_SUSPECT</text>
<text x="705.0" y="456.6" text-anchor="middle" font-size="10" fill="#6b7280">可疑仍可能有效·降权+警示</text>
<text x="960.0" y="441.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">CONFLICTED</text>
<text x="960.0" y="456.6" text-anchor="middle" font-size="10" fill="#6b7280">未消解冲突·成对返回</text>
<text x="700.0" y="591.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">SUPERSEDED</text>
<text x="700.0" y="606.6" text-anchor="middle" font-size="10" fill="#6b7280">已被替代（软失效）</text>
<text x="935.0" y="591.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">ARCHIVED</text>
<text x="935.0" y="606.6" text-anchor="middle" font-size="10" fill="#6b7280">主动归档留证</text>
<text x="1150.0" y="591.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">EXPIRED</text>
<text x="1150.0" y="606.6" text-anchor="middle" font-size="10" fill="#6b7280">保留期到·待销毁</text>
<text x="1320.0" y="591.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">ERASED</text>
<text x="1320.0" y="606.6" text-anchor="middle" font-size="10" fill="#6b7280">仅留墓碑</text>
<text x="60" y="700" text-anchor="start" font-size="12" font-weight="600" fill="#111827">召回行为：</text>
<text x="180" y="699.8" text-anchor="middle" font-size="10.5" font-weight="400" fill="#111827">ACTIVE → 默认进召回</text>
<text x="360" y="699.8" text-anchor="middle" font-size="10.5" font-weight="400" fill="#111827">STALE_SUSPECT → 降权 + 带警示</text>
<text x="600" y="699.8" text-anchor="middle" font-size="10.5" font-weight="400" fill="#111827">CONFLICTED → 成对返回 + 进 notes</text>
<text x="860" y="699.8" text-anchor="middle" font-size="10.5" font-weight="400" fill="#111827">QUARANTINED → 永不进召回</text>
<text x="60" y="736" text-anchor="start" font-size="11" font-weight="400" fill="#6b7280">不变式 1：默认软失效；硬删只能由 erasure 流程触发，必须留墓碑、必须级联、必须可验证</text>
<text x="60" y="753" text-anchor="start" font-size="11" font-weight="400" fill="#6b7280">不变式 2：状态转移必须写事件（bw_lifecycle_event，append-only），无事件的状态变化视为 bug</text>
<text x="60" y="770" text-anchor="start" font-size="11" font-weight="400" fill="#6b7280">不变式 3：不可逆转移只有两个 —— →SUPERSEDED 与 →ERASED；其余全部可回退以支持误判恢复</text>
<rect x="1090" y="680" width="324" height="94" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="1102" y="698" font-size="11" font-weight="600" fill="#6b7280">图例</text>
<line x1="1104" y1="712" x2="1130" y2="712" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-main)"/>
