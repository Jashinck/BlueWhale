<text x="537" y="430" text-anchor="end" font-size="10" font-weight="500" fill="#dc2626">新版本替代（不可逆）</text>
<rect x="1139.0" y="547.5" width="130.2" height="15.0" rx="3" ry="3" fill="#ffffff" opacity="0.94"/>
