<text x="400.0" y="138.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">触发 · Transition / Actor</text>
<text x="400.0" y="153.6" text-anchor="middle" font-size="10" fill="#6b7280">源变更 · nCorrected 超阈 · 复审逾期 · 合规请求</text>
<text x="400.0" y="198.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">StateMachine</text>
<text x="400.0" y="213.6" text-anchor="middle" font-size="10" fill="#6b7280">transition() 唯一入口：每次转移必写 lifecycle event</text>
<text x="400.0" y="262.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">TimelineService</text>
<text x="400.0" y="277.6" text-anchor="middle" font-size="10" fill="#6b7280">四时间轴（现实/系统/采集/治理）读写</text>
<text x="400.0" y="326.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">ConflictResolver</text>
<text x="400.0" y="341.6" text-anchor="middle" font-size="10" fill="#6b7280">调和 PAD：裁决顺序 + bi-temporal 写边</text>
<text x="400.0" y="390.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">ErasureEngine</text>
<text x="400.0" y="405.6" text-anchor="middle" font-size="10" fill="#6b7280">受控销毁：legal hold 判定 + 级联 + 召回探针验证</text>
<text x="400.0" y="454.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">ImpactService</text>
<text x="400.0" y="469.6" text-anchor="middle" font-size="10" fill="#6b7280">血缘影响分析 impact(unitId, depth)</text>
<text x="400.0" y="514.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">输出 · TransitionResult</text>
<text x="400.0" y="529.6" text-anchor="middle" font-size="10" fill="#6b7280">状态转移结果 + 事件证据（append-only）</text>
<text x="800" y="112" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">周期 job（各自独立幂等、可重入、可单跑）</text>
<text x="1070.0" y="146.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ReconcileJob</text>
<text x="1070.0" y="161.4" text-anchor="middle" font-size="10" fill="#6b7280">冲突调和，源变更触发 + 兜底轮询</text>
<text x="1070.0" y="198.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ReviewJob</text>
<text x="1070.0" y="213.4" text-anchor="middle" font-size="10" fill="#6b7280">复审逾期扫描 + 自动续期，日级</text>
<text x="1070.0" y="250.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">RetentionJob</text>
<text x="1070.0" y="265.4" text-anchor="middle" font-size="10" fill="#6b7280">保留期到期 → EXPIRED，日级</text>
<text x="1070.0" y="302.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ErasureJob</text>
<text x="1070.0" y="317.4" text-anchor="middle" font-size="10" fill="#6b7280">EXPIRED → ERASED，须校验 legal hold</text>
<text x="1070.0" y="354.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">PropagationJob</text>
<text x="1070.0" y="369.4" text-anchor="middle" font-size="10" fill="#6b7280">血缘传播，事件触发</text>
<text x="800" y="404" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">端口（SPI，定义于 domain）</text>
<text x="1070.0" y="438.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ClockPort</text>
<text x="1070.0" y="453.4" text-anchor="middle" font-size="10" fill="#6b7280">时间源（四时间轴 / 衰减 / 复审到期）</text>
<text x="1070.0" y="492.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">PolicyPort</text>
<text x="1070.0" y="507.4" text-anchor="middle" font-size="10" fill="#6b7280">保留策略 / 衰减策略 / 失效规则</text>
<text x="800" y="548" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">存储</text>
<text x="900" y="634.3" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111827">bw_lifecycle_event</text>
<text x="1080" y="634.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_lineage</text>
<text x="900" y="714.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_asset</text>
<text x="1080" y="714.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_erasure</text>
<text x="900" y="794.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_review</text>
<text x="560" y="848" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">三不变式：默认软失效；状态转移必写事件；不可逆转移仅 →SUPERSEDED 与 →ERASED。</text>
<text x="560" y="865" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">legal hold 优先于一切擦除；ERASED 只留墓碑（bw_erasure），召回探针验证不可见。</text>
<rect x="60" y="830" width="244" height="114" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="72" y="848" font-size="11" font-weight="600" fill="#6b7280">图例</text>
<line x1="74" y1="862" x2="100" y2="862" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-main)"/>
<text x="108" y="866.0" font-size="11" fill="#111827">引擎流转</text>
<line x1="74" y1="882" x2="100" y2="882" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-ctrl)"/>
<text x="108" y="886.0" font-size="11" fill="#111827">事件写入（append-only）</text>
<line x1="74" y1="902" x2="100" y2="902" stroke="#0d9488" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
<text x="108" y="906.0" font-size="11" fill="#111827">job 触发（异步）</text>
<line x1="74" y1="922" x2="100" y2="922" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>
<text x="108" y="926.0" font-size="11" fill="#111827">端口实现</text>
</svg>