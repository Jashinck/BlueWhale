<rect width="1400" height="1000" fill="#ffffff"/>
<text x="40" y="42" font-size="19" font-weight="700" fill="#111827">生命周期与治理 · 内部架构</text>
<text x="40" y="64" font-size="12.5" fill="#6b7280">状态机唯一入口 + 四时间轴 + 冲突调和 + 受控销毁 + 血缘影响分析 + 五个周期 job + 端口 + 存储</text>
<rect x="40" y="84" width="1320" height="880" rx="12" ry="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.55"/>
<text x="54" y="106" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.4">生命周期与治理模块</text>
