<text x="400.0" y="138.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">输入 · CaptureSignal</text>
<text x="400.0" y="153.6" text-anchor="middle" font-size="10" fill="#6b7280">会话 · 工具调用 · 用户反馈信号</text>
<text x="400.0" y="198.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">CaptureService · 捕获</text>
<text x="400.0" y="213.6" text-anchor="middle" font-size="10" fill="#6b7280">写 bw_episode（LEDGER，只增不改）</text>
<text x="400.0" y="262.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">MemoryExtractor · 抽取</text>
<text x="400.0" y="277.6" text-anchor="middle" font-size="10" fill="#6b7280">与既有记忆比对 → ADD / UPDATE / DELETE / NOOP</text>
<text x="400.0" y="326.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">EntityLinker · 挂链</text>
<text x="400.0" y="341.6" text-anchor="middle" font-size="10" fill="#6b7280">实体链接 + ABOUT / DERIVED_FROM 边</text>
<text x="400.0" y="390.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">Consolidator · 巩固蒸馏</text>
<text x="400.0" y="405.6" text-anchor="middle" font-size="10" fill="#6b7280">相似聚类 → 模型蒸馏（推理模型）→ DISTILLED</text>
<text x="400.0" y="454.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">DecayEngine · 衰减强化</text>
<text x="400.0" y="469.6" text-anchor="middle" font-size="10" fill="#6b7280">salience = f(importance, Δt, 四计数)</text>
<text x="400.0" y="518.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">Reflector · 复盘</text>
<text x="400.0" y="533.6" text-anchor="middle" font-size="10" fill="#6b7280">轨迹反思 → SKILL → 晋升闸门（人审）</text>
<text x="400.0" y="578.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">输出 · MaintenanceReport</text>
<text x="400.0" y="593.6" text-anchor="middle" font-size="10" fill="#6b7280">每条决策 append-only 写 bw_lifecycle_event</text>
<text x="800" y="112" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">反馈与周期 job（失败域隔离 · 各自幂等）</text>
<text x="1070.0" y="146.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">FeedbackRecorder</text>
<text x="1070.0" y="161.4" text-anchor="middle" font-size="10" fill="#6b7280">recordApplied(ADOPTED|CORRECTED) → economy 四计数</text>
<text x="1070.0" y="198.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ConsolidateJob</text>
<text x="1070.0" y="213.4" text-anchor="middle" font-size="10" fill="#6b7280">巩固/抽象，分钟级；幂等键 (jobRunId, unitId)</text>
<text x="1070.0" y="250.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">DecayJob</text>
<text x="1070.0" y="265.4" text-anchor="middle" font-size="10" fill="#6b7280">衰减/强化，高频定时；技能只降权不遗忘</text>
<text x="1070.0" y="302.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ReflectionJob</text>
<text x="1070.0" y="317.4" text-anchor="middle" font-size="10" fill="#6b7280">会话/任务结束事件驱动</text>
<text x="800" y="356" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">端口（SPI，定义于 domain）</text>
<text x="930.0" y="390.8" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ExtractionPort</text>
<text x="930.0" y="405.0" text-anchor="middle" font-size="9.5" fill="#6b7280">抽取、蒸馏与重排</text>
<text x="1215.0" y="390.8" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">EmbeddingPort</text>
<text x="1215.0" y="405.0" text-anchor="middle" font-size="9.5" fill="#6b7280">向量化</text>
<text x="930.0" y="444.8" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">IndexPort</text>
<text x="930.0" y="459.0" text-anchor="middle" font-size="9.5" fill="#6b7280">HNSW/BM25/图</text>
<text x="1215.0" y="444.8" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ClockPort</text>
<text x="1215.0" y="459.0" text-anchor="middle" font-size="9.5" fill="#6b7280">时间源（衰减/双时态）</text>
<text x="800" y="500" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">存储</text>
<text x="900" y="586.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_episode</text>
<text x="1080" y="586.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_context_unit</text>
<text x="900" y="666.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_unit_edge</text>
<text x="1080" y="666.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_usage_event</text>
<text x="900" y="746.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_lineage</text>
<text x="560" y="848" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">记忆抽取的 ADD/UPDATE/DELETE/NOOP 是写入核心决策，非无条件 append；</text>
<text x="560" y="865" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">episode 原文永远保留做溯源；退场候选 ≠ 删除，销毁走受控销毁（legal hold 优先）。</text>
<rect x="60" y="830" width="244" height="114" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
