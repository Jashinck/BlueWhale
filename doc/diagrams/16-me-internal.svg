<text x="108" y="906.0" font-size="11" fill="#111827">反馈信号（异步）</text>
<line x1="74" y1="922" x2="100" y2="922" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>
<text x="108" y="926.0" font-size="11" fill="#111827">端口实现</text>
