<ellipse cx="900" cy="596" rx="75.0" ry="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="400.0" y="138.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">输入 · ResolveQuery</text>
<text x="400.0" y="153.4" text-anchor="middle" font-size="10" fill="#6b7280">traceId · scope栈 · intent · query · budget · lines · depth</text>
<text x="400.0" y="198.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">PermissionFilter · 权限前置</text>
<text x="400.0" y="213.6" text-anchor="middle" font-size="10" fill="#6b7280">可见域 = scope ∩ AccessPolicy（召回前过滤）</text>
<text x="400.0" y="262.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">IntentGate · 意图门控</text>
<text x="400.0" y="277.6" text-anchor="middle" font-size="10" fill="#6b7280">规则 + 轻量模型：要不要检索？选择事件时间线、实体关系图还是精炼文档层？</text>
<text x="400.0" y="326.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">MultiRecall · 多路召回</text>
<text x="400.0" y="341.6" text-anchor="middle" font-size="10" fill="#6b7280">dense(HNSW) / BM25 / 图遍历 并发</text>
<text x="400.0" y="390.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">RRFFusion · 融合</text>
<text x="400.0" y="405.6" text-anchor="middle" font-size="10" fill="#6b7280">k=60 名次倒数融合</text>
<text x="400.0" y="454.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">Reranker · 重排</text>
<text x="400.0" y="469.6" text-anchor="middle" font-size="10" fill="#6b7280">cross-encoder(重排/调和模型) 或 向量+词面混合</text>
<text x="400.0" y="518.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">MMRDeduplicator · 去冗</text>
<text x="400.0" y="533.6" text-anchor="middle" font-size="10" fill="#6b7280">λ 多样性，剔除高度重复候选</text>
<text x="400.0" y="582.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">BudgetAllocator · 预算</text>
<text x="400.0" y="597.6" text-anchor="middle" font-size="10" fill="#6b7280">CORE/ON_DEMAND 切分 + 摘要→概览 展开决策</text>
<text x="400.0" y="642.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">输出 · ContextBundle</text>
<text x="400.0" y="657.6" text-anchor="middle" font-size="10" fill="#6b7280">items+level+citations+trace 或 EMPTY + 原因码</text>
<text x="800" y="112" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">横切</text>
<text x="1070.0" y="146.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">TraceRecorder</text>
<text x="1070.0" y="161.4" text-anchor="middle" font-size="10" fill="#6b7280">全链路 trace：门控/分数/融合权重/MMR/预算 可回放</text>
<text x="1070.0" y="198.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">StateFilter</text>
<text x="1070.0" y="213.4" text-anchor="middle" font-size="10" fill="#6b7280">bi-temporal 状态过滤：仅 ACTIVE/STALE(降权)/CONFLICTED(成对)</text>
<text x="800" y="256" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">端口（SPI，定义于 domain）</text>
<text x="1070.0" y="290.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">IndexPort</text>
<text x="1070.0" y="305.4" text-anchor="middle" font-size="10" fill="#6b7280">dense(HNSW) / BM25 / 图遍历 三路</text>
<text x="1070.0" y="344.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">RetrievalPort</text>
<text x="1070.0" y="359.4" text-anchor="middle" font-size="10" fill="#6b7280">候选 + 分数（路级 deadline）</text>
<text x="1070.0" y="398.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">EmbeddingPort</text>
<text x="1070.0" y="413.4" text-anchor="middle" font-size="10" fill="#6b7280">重排/查询向量化</text>
<text x="800" y="456" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">存储</text>
<text x="900" y="542.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_context_unit</text>
<text x="1080" y="542.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_unit_edge</text>
<text x="900" y="622.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_usage_event</text>
<text x="560" y="848" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">EMPTY 是合法答案（证据不足/权限不足/冲突未决 → 空 + 原因码）；</text>
<text x="560" y="865" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">重排模型调用是默认路径唯一的 LLM 点，且必须记 bw_usage_event（异步）。</text>
<rect x="60" y="830" width="244" height="94" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="72" y="848" font-size="11" font-weight="600" fill="#6b7280">图例</text>
