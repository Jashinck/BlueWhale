<text x="778" y="316" text-anchor="start" font-size="9.5" font-weight="500" fill="#ea580c">检索</text>
<text x="778" y="140" text-anchor="start" font-size="9.5" font-weight="500" fill="#6b7280">埋点</text>
<text x="1078" y="466" text-anchor="start" font-size="9.5" font-weight="500" fill="#6b7280">实现</text>
<rect x="60" y="120" width="680" height="44" rx="8" ry="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<rect x="60" y="176" width="680" height="52" rx="8" ry="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
