<rect width="1400" height="1000" fill="#ffffff"/>
<text x="40" y="42" font-size="19" font-weight="700" fill="#111827">上下文供给 · 内部架构</text>
<text x="40" y="64" font-size="12.5" fill="#6b7280">读路径 七步装配组件（默认 0 次 LLM）+ 横切（trace/状态过滤）+ 端口 + 存储；同步 p95 &lt; 300ms</text>
<rect x="40" y="84" width="1320" height="880" rx="12" ry="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.55"/>
<text x="54" y="106" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.4">上下文供给模块</text>
