<text x="108" y="866.0" font-size="11" fill="#111827">装配流转</text>
<line x1="74" y1="882" x2="100" y2="882" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-ctrl)"/>
<text x="108" y="886.0" font-size="11" fill="#111827">检索委托</text>
<line x1="74" y1="902" x2="100" y2="902" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>
<text x="108" y="906.0" font-size="11" fill="#111827">埋点 / 端口实现</text>
</svg>