<rect width="1400" height="900" fill="#ffffff"/>
<text x="40" y="42" font-size="19" font-weight="700" fill="#111827">管理端 · 内部架构（Client 应用）</text>
<text x="40" y="64" font-size="12.5" fill="#6b7280">前端三功能域（知识治理/记忆管理/看板）+ 权限门面 + API client ↔ server 管理端 API 面</text>
<rect x="40" y="84" width="760" height="780" rx="12" ry="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.55"/>
<text x="54" y="106" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.4">Client 端 · 独立前端应用（知识工程与管理端）</text>
<rect x="840" y="84" width="520" height="780" rx="12" ry="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.55"/>
<text x="854" y="106" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="0.4">Server 端 · 管理端 API 面</text>
