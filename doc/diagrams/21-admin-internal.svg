<text x="1023" y="350" text-anchor="start" font-size="9.5" font-weight="500" fill="#6b7280">留痕</text>
<rect x="779.5" y="383.1" width="60.9" height="15.8" rx="3" ry="3" fill="#ffffff" opacity="0.94"/>
<text x="810" y="392" text-anchor="middle" font-size="10.5" font-weight="500" fill="#2563eb">管理端 API</text>
