<text x="420.0" y="144.2" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">知识治理 UI</text>
<text x="420.0" y="159.9" text-anchor="middle" font-size="10.5" fill="#6b7280">审核队列 · 发布管理 · 降权/废弃 · 本体管理 · 血缘视图</text>
<text x="420.0" y="212.2" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">记忆管理 UI</text>
<text x="420.0" y="227.9" text-anchor="middle" font-size="10.5" fill="#6b7280">我的记忆（查看/编辑/撤销）· 纠正回炉 · 晋升候选</text>
<text x="420.0" y="280.2" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">生命周期看板 UI</text>
<text x="420.0" y="295.9" text-anchor="middle" font-size="10.5" fill="#6b7280">12 态分布 · 冲突积压 · 无主资产 · 复审逾期 · erasure 台</text>
<text x="420.0" y="342.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">权限门面</text>
<text x="420.0" y="357.6" text-anchor="middle" font-size="10" fill="#6b7280">用户仅见自己记忆；治理者按 scope 授权（复用 AccessPolicy）</text>
<text x="420.0" y="398.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">API Client</text>
<text x="420.0" y="413.6" text-anchor="middle" font-size="10" fill="#6b7280">REST / MCP（管理端 API）；薄客户端，无业务规则</text>
<text x="1100.0" y="144.2" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">bluewhale-interfaces</text>
<text x="1100.0" y="159.9" text-anchor="middle" font-size="10.5" fill="#6b7280">REST + MCP + 管理端 API（DTO 转换 · 参数校验）</text>
<text x="1100.0" y="212.2" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">GovernReviewUseCase</text>
<text x="1100.0" y="227.9" text-anchor="middle" font-size="10.5" fill="#6b7280">审核决策（通过/驳回/批注）→ 状态转移</text>
<text x="1100.0" y="280.2" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">本体 / 发布 / 血缘用例</text>
<text x="1100.0" y="295.9" text-anchor="middle" font-size="10.5" fill="#6b7280">本体 PROPOSED 裁决 · 批次发布 · impact() 查询</text>
<text x="860" y="344" text-anchor="start" font-size="12.5" font-weight="600" fill="#111827">留痕存储（append-only）</text>
<text x="940" y="430.4" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_review</text>
<text x="1120" y="430.3" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111827">bw_lifecycle_event</text>
<text x="940" y="510.4" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">bw_asset</text>
<text x="420" y="640" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">管理端是薄客户端：所有业务规则留在 server 的 application/domain 层；</text>
<text x="420" y="657" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">所有管理动作 append-only 写 bw_review / bw_lifecycle_event，可审计；</text>
<text x="420" y="674" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">权限前置：不该见的 unit 不出现在任何视图。</text>
<rect x="60" y="620" width="264" height="74" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="72" y="638" font-size="11" font-weight="600" fill="#6b7280">图例</text>
<line x1="74" y1="652" x2="100" y2="652" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-main)"/>
<text x="108" y="656.0" font-size="11" fill="#111827">模块流转 / 网络调用</text>
<line x1="74" y1="672" x2="100" y2="672" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>
<text x="108" y="676.0" font-size="11" fill="#111827">留痕写入</text>
</svg>