<text x="60" y="917" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">EMPTY 是正确答案：证据不足 / 权限不足 / 冲突未决 → 返回空 + 原因码，不凑数注入；CONFLICTED 单元成对返回。</text>
<text x="60" y="934" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">全链路 trace 可回放：门控判定 · 各路命中与分数 · 融合权重 · 重排分 · MMR · 预算分配 · 摘要→概览 决策。</text>
