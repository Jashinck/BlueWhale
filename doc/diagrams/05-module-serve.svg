<ellipse cx="1050" cy="482" rx="190.0" ry="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="860" y="560" width="380" height="60" rx="8" ry="8" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="210.0" y="129.3" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">入口 resolve(query, scope栈, budget, mode)</text>
<text x="210.0" y="191.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">权限前置</text>
<text x="210.0" y="206.6" text-anchor="middle" font-size="10" fill="#6b7280">scope 可见性 + AccessPolicy（召回前过滤，非召回后）</text>
<text x="210" y="271.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">意图门控</text>
<text x="210" y="287.0" text-anchor="middle" font-size="10" fill="#6b7280">要不要检索？检索选择事件时间线、实体关系图还是精炼文档层？</text>
<text x="210.0" y="366.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">多路召回（并发）</text>
<text x="210.0" y="381.6" text-anchor="middle" font-size="10" fill="#6b7280">dense + BM25 + 图遍历 + 时间过滤（bi-temporal）</text>
<text x="210.0" y="446.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">RRF 融合（k=60）</text>
<text x="210.0" y="510.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">重排 cross-encoder（重排/调和模型）</text>
<text x="210.0" y="574.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">MMR 去冗（λ 多样性）</text>
<text x="210.0" y="638.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">预算分配</text>
<text x="210.0" y="653.6" text-anchor="middle" font-size="10" fill="#6b7280">CORE / ON_DEMAND 切分 + 摘要→概览 展开决策</text>
<text x="210.0" y="713.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">出口 ContextBundle</text>
<text x="210.0" y="728.6" text-anchor="middle" font-size="10" fill="#6b7280">items + level + citations + trace</text>
<text x="610.0" y="261.8" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">EMPTY + 原因码</text>
<text x="610.0" y="276.1" text-anchor="middle" font-size="9.5" fill="#6b7280">NOT_RETRIEVAL_BEARING / NO_EVIDENCE</text>
<text x="610.0" y="290.3" text-anchor="middle" font-size="9.5" fill="#6b7280">PERMISSION / CONFLICT_PENDING</text>
<text x="610.0" y="366.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">装载三预算</text>
<text x="610.0" y="381.6" text-anchor="middle" font-size="10" fill="#6b7280">CORE：身份/任务，总是满载</text>
<text x="610.0" y="396.6" text-anchor="middle" font-size="10" fill="#6b7280">ON_DEMAND：长期记忆/知识，按需加载</text>
<text x="610.0" y="411.6" text-anchor="middle" font-size="10" fill="#6b7280">LEDGER：事件账本，只写不读（供再加工与审计）</text>
<text x="610.0" y="471.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">EMPTY 是正确答案</text>
<text x="610.0" y="486.6" text-anchor="middle" font-size="10" fill="#6b7280">证据不足 / 权限不足 / 冲突未决 → 返回空 + 原因码</text>
<text x="610.0" y="501.6" text-anchor="middle" font-size="10" fill="#6b7280">不凑数注入（堵 LoCoMo 对抗类幻觉）</text>
<text x="610.0" y="516.6" text-anchor="middle" font-size="10" fill="#6b7280">CONFLICTED 单元成对返回，不单边裁决</text>
<text x="610.0" y="571.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">trace 全链路可回放</text>
<text x="610.0" y="586.6" text-anchor="middle" font-size="10" fill="#6b7280">门控判定 · 各路命中与分数 · 融合权重</text>
<text x="610.0" y="601.6" text-anchor="middle" font-size="10" fill="#6b7280">重排分 · MMR 选择 · 预算分配 · 摘要→概览 决策</text>
<text x="610.0" y="616.6" text-anchor="middle" font-size="10" fill="#6b7280">无 trace 则归因与调参无从谈起</text>
<text x="610.0" y="674.1" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">0 次 LLM 约束</text>
<text x="610.0" y="689.1" text-anchor="middle" font-size="10" fill="#6b7280">门控 = 规则 + 轻量模型；重排 = 重排/调和模型 或向量+词面混合</text>
<text x="610.0" y="704.1" text-anchor="middle" font-size="10" fill="#6b7280">多跳 agentic 深检索 = 显式工具 explore/expand（异步记账）</text>
<text x="905" y="401.6" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">向量 HNSW</text>
<text x="997" y="401.6" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">词法 BM25</text>
<text x="1089" y="401.6" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">图遍历</text>
<text x="1181" y="401.6" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">目录树</text>
<text x="1050" y="506.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">ContextUnit 存储（PostgreSQL）</text>
<text x="1050" y="522.5" text-anchor="middle" font-size="10" fill="#6b7280">bw_context_unit · bw_unit_edge</text>
<text x="1050.0" y="586.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">使用反馈接收</text>
<text x="1050.0" y="601.6" text-anchor="middle" font-size="10" fill="#6b7280">feedback → bw_usage_event → unit 级归因</text>
<rect x="60" y="790" width="624" height="94" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="72" y="808" font-size="11" font-weight="600" fill="#6b7280">图例</text>
<line x1="74" y1="822" x2="100" y2="822" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-main)"/>
<text x="108" y="826.0" font-size="11" fill="#111827">读路径主流程（同步 p95 &lt; 300ms）</text>
<line x1="74" y1="842" x2="100" y2="842" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>
<text x="108" y="846.0" font-size="11" fill="#111827">索引委托</text>
<line x1="74" y1="862" x2="100" y2="862" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-data)"/>
<text x="108" y="866.0" font-size="11" fill="#111827">原文 按需展开</text>
<line x1="374" y1="822" x2="400" y2="822" stroke="#9333ea" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-async)"/>
<text x="408" y="826.0" font-size="11" fill="#111827">使用反馈（异步）</text>
<line x1="374" y1="842" x2="400" y2="842" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
<text x="408" y="846.0" font-size="11" fill="#111827">EMPTY / 拒绝注入</text>
</svg>