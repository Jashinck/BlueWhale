<rect x="217.0" y="319.5" width="24.8" height="15.0" rx="3" ry="3" fill="#ffffff" opacity="0.94"/>
<text x="220" y="328" text-anchor="start" font-size="10" font-weight="500" fill="#2563eb">YES</text>
<rect x="339.2" y="253.5" width="71.6" height="15.0" rx="3" ry="3" fill="#ffffff" opacity="0.94"/>
<text x="375" y="262" text-anchor="middle" font-size="10" font-weight="500" fill="#dc2626">NO / 证据不足</text>
<rect x="675.6" y="305.5" width="48.8" height="15.0" rx="3" ry="3" fill="#ffffff" opacity="0.94"/>
<text x="700" y="314" text-anchor="middle" font-size="10" font-weight="500" fill="#6b7280">并发查询</text>
<rect x="545.1" y="431.5" width="109.8" height="15.0" rx="3" ry="3" fill="#ffffff" opacity="0.94"/>
<text x="600" y="440" text-anchor="middle" font-size="10" font-weight="500" fill="#6b7280">候选 摘要/概览 + 分数</text>
<rect x="550.9" y="633.5" width="98.2" height="15.0" rx="3" ry="3" fill="#ffffff" opacity="0.94"/>
<text x="600" y="642" text-anchor="middle" font-size="10" font-weight="500" fill="#16a34a">概览→原文 按需展开</text>
<rect x="499.0" y="749.1" width="262.1" height="15.8" rx="3" ry="3" fill="#ffffff" opacity="0.94"/>
<text x="630" y="758" text-anchor="middle" font-size="10.5" font-weight="500" fill="#9333ea">feedback(adopted / corrected / outcome / cost)</text>
