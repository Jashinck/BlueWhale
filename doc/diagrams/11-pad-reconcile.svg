<text x="40" y="42" font-size="19" font-weight="700" fill="#111827">PAD 图 · 调和 / 冲突消解算法</text>
<text x="40" y="64" font-size="12.5" fill="#6b7280">嵌套层级 = 控制结构（SEQ/SEL/LOOP）；冲突 ≠ 覆盖，败者软失效留 supersededBy</text>
