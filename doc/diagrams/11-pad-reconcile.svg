<text x="320.0" y="114.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">输入</text>
<text x="320.0" y="128.9" text-anchor="middle" font-size="9.5" fill="#6b7280">新候选 C + 同指称现有集 E（按 entity/QID 聚类）</text>
<text x="320.0" y="174.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">LOOP  对 E 中每个 e</text>
<text x="320.0" y="188.9" text-anchor="middle" font-size="9.5" fill="#6b7280">SEQ 内层逐条调和</text>
<text x="400.0" y="234.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">SEL  rel = relate(C, e)</text>
<text x="400.0" y="248.9" text-anchor="middle" font-size="9.5" fill="#6b7280">ENTAILS / CONTRADICTS / OVERLAPS / UNRELATED</text>
<text x="470.0" y="292.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">CONTRADICTS</text>
<text x="470.0" y="306.3" text-anchor="middle" font-size="9" fill="#6b7280">→ 冲突消解（见下 SEL）</text>
<text x="470.0" y="342.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">ENTAILS / OVERLAPS</text>
<text x="470.0" y="356.3" text-anchor="middle" font-size="9" fill="#6b7280">→ 挂边合并，不覆盖旧值</text>
<text x="470.0" y="392.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">UNRELATED</text>
<text x="470.0" y="406.3" text-anchor="middle" font-size="9" fill="#6b7280">→ C 直接新增为独立 unit</text>
<text x="400.0" y="454.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">冲突消解 · 优先级裁决</text>
<text x="400.0" y="468.9" text-anchor="middle" font-size="9.5" fill="#6b7280">scope&gt;origin&gt;时间&gt;confidence（见右）</text>
<text x="470.0" y="512.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">可裁决</text>
<text x="470.0" y="526.3" text-anchor="middle" font-size="9" fill="#6b7280">胜 ACTIVE / 败 SUPERSEDED(soft) + 写 edge</text>
<text x="470.0" y="562.8" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">不可裁决</text>
<text x="470.0" y="576.3" text-anchor="middle" font-size="9" fill="#6b7280">双方 CONFLICTED + 进人审 + 成对召回</text>
<text x="320.0" y="624.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">写 bi-temporal</text>
<text x="320.0" y="638.9" text-anchor="middle" font-size="9.5" fill="#6b7280">validFrom / validTo / supersededBy / bw_unit_edge</text>
<text x="320.0" y="684.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">写 bw_lifecycle_event</text>
<text x="320.0" y="698.9" text-anchor="middle" font-size="9.5" fill="#6b7280">append-only，无事件的状态变化 = bug</text>
<text x="320.0" y="744.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">输出</text>
<text x="320.0" y="758.9" text-anchor="middle" font-size="9.5" fill="#6b7280">调和后 unit 集 + 边 + 事件（供 发布）</text>
<text x="1020.0" y="128.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">优先级裁决顺序（高→低）</text>
<text x="1020.0" y="143.4" text-anchor="middle" font-size="10" fill="#6b7280">先比较 scope：更具体者胜（子 scope &gt; 父 scope）</text>
<text x="1020.0" y="158.4" text-anchor="middle" font-size="10" fill="#6b7280">再比较 origin：更可信者胜（OBSERVED &gt; DECLARED &gt; DISTILLED）</text>
<text x="1020.0" y="173.4" text-anchor="middle" font-size="10" fill="#6b7280">再比较采集时间：更新者胜（source_published_at）</text>
<text x="1020.0" y="188.4" text-anchor="middle" font-size="10" fill="#6b7280">最后比较 confidence：更高者胜</text>
<text x="1020.0" y="203.4" text-anchor="middle" font-size="10" fill="#6b7280">同级仍平 → 判「不可裁决」，转 CONFLICTED</text>
<text x="1020.0" y="283.4" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">冲突 ≠ 覆盖（三纪律）</text>
<text x="1020.0" y="298.4" text-anchor="middle" font-size="10" fill="#6b7280">不物理覆盖旧值；败者软失效留 supersededBy</text>
<text x="1020.0" y="313.4" text-anchor="middle" font-size="10" fill="#6b7280">CONFLICTED 召回必须成对返回，不单边裁决</text>
<text x="1020.0" y="328.4" text-anchor="middle" font-size="10" fill="#6b7280">时间旅行可查：validTo 之前的版本仍可见</text>
<text x="1020.0" y="406.9" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">bi-temporal 双时间轴</text>
<text x="1020.0" y="421.9" text-anchor="middle" font-size="10" fill="#6b7280">事件时间（源何时生效）vs 系统时间（何时入库/失效）</text>
<text x="1020.0" y="436.9" text-anchor="middle" font-size="10" fill="#6b7280">纠正历史不改写，只追加新版本</text>
<text x="760" y="492" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">不变式：默认软失效（留墓碑）；状态转移必写 bw_lifecycle_event；</text>
<text x="760" y="509" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">仅 →SUPERSEDED / →ERASED 不可逆，其余可回退以支持误判恢复。</text>
<text x="760" y="526" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b7280">调和是增量优先：只重算受影响的同指称簇，不做全量重扫。</text>
</svg>