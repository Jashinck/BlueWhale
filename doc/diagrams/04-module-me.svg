<text x="140.0" y="147.8" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">捕获</text>
<text x="140.0" y="162.1" text-anchor="middle" font-size="9.5" fill="#6b7280">对话轮 · 工具调用 · 成败</text>
<text x="140.0" y="176.3" text-anchor="middle" font-size="9.5" fill="#6b7280">用户纠正 · token/美元成本</text>
<text x="140.0" y="190.6" text-anchor="middle" font-size="9.5" fill="#6b7280">产物：CaptureSignal</text>
<text x="342.0" y="147.8" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">抽取</text>
<text x="342.0" y="162.1" text-anchor="middle" font-size="9.5" fill="#6b7280">候选事实 + 写入决策</text>
<text x="342.0" y="176.3" text-anchor="middle" font-size="9.5" fill="#6b7280">ADD / UPDATE / DELETE / NOOP</text>
<text x="342.0" y="190.6" text-anchor="middle" font-size="9.5" fill="#6b7280">与既有记忆比对（Mem0 式）</text>
<text x="544.0" y="147.8" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">挂链</text>
<text x="544.0" y="162.1" text-anchor="middle" font-size="9.5" fill="#6b7280">episode 原文溯源</text>
<text x="544.0" y="176.3" text-anchor="middle" font-size="9.5" fill="#6b7280">实体链接：挂在实体上</text>
<text x="544.0" y="190.6" text-anchor="middle" font-size="9.5" fill="#6b7280">而非漂浮的孤立事实</text>
<text x="746.0" y="147.8" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">巩固</text>
<text x="746.0" y="162.1" text-anchor="middle" font-size="9.5" fill="#6b7280">去重合并 · 相似聚类</text>
<text x="746.0" y="176.3" text-anchor="middle" font-size="9.5" fill="#6b7280">情景→语义 模型蒸馏（推理模型）</text>
<text x="746.0" y="190.6" text-anchor="middle" font-size="9.5" fill="#6b7280">多条→技能 SkillCandidate</text>
<text x="948.0" y="147.8" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">自适应</text>
<text x="948.0" y="162.1" text-anchor="middle" font-size="9.5" fill="#6b7280">衰减 exp(-λ·Δt) · 强化</text>
<text x="948.0" y="176.3" text-anchor="middle" font-size="9.5" fill="#6b7280">采纳/纠正信号驱动权重</text>
<text x="948.0" y="190.6" text-anchor="middle" font-size="9.5" fill="#6b7280">程序性记忆不参与遗忘</text>
<text x="1150.0" y="147.8" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">复盘</text>
<text x="1150.0" y="162.1" text-anchor="middle" font-size="9.5" fill="#6b7280">任务后轨迹反思</text>
<text x="1150.0" y="176.3" text-anchor="middle" font-size="9.5" fill="#6b7280">产出可复用程序性记忆</text>
<text x="1150.0" y="190.6" text-anchor="middle" font-size="9.5" fill="#6b7280">从"记住"到"学会"</text>
<text x="241" y="248.6" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">CaptureSignal</text>
<text x="443" y="248.6" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">候选+决策</text>
<text x="645" y="248.6" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">linked fact</text>
<text x="847" y="248.6" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">DISTILLED</text>
<text x="1049" y="248.6" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">权重更新</text>
<text x="172.0" y="341.6" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">状态迁移 lifecycle_event</text>
<text x="484.0" y="341.6" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">晋升 Promotion：跨≥N agent 采纳&gt;阈值 → 审核 → scope=project</text>
<text x="831.0" y="341.6" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">降权 Demotion：频繁纠正/命中冲突 → STALE_SUSPECT</text>
<text x="1103.0" y="341.6" text-anchor="middle" font-size="10" font-weight="400" fill="#111827">Bootstrap：知识本体为记忆提供挂载点</text>
<text x="240.0" y="423.9" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">捕获源（事件只增不改，写满不读回）</text>
<text x="240.0" y="438.9" text-anchor="middle" font-size="10" fill="#6b7280">Langur trace · RSI MemoryDistiller</text>
<text x="240.0" y="453.9" text-anchor="middle" font-size="10" fill="#6b7280">工具调用结果 · 用户纠正 · 成本账</text>
<text x="640.0" y="423.9" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">存储表（PostgreSQL）</text>
<text x="640.0" y="438.9" text-anchor="middle" font-size="10" fill="#6b7280">bw_episode · bw_context_unit · bw_usage_event</text>
<text x="640.0" y="453.9" text-anchor="middle" font-size="10" fill="#6b7280">bw_lineage · bw_lifecycle_event</text>
<text x="1045.0" y="423.9" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">端口与策略（domain 定义）</text>
<text x="1045.0" y="438.9" text-anchor="middle" font-size="10" fill="#6b7280">CapturePort · ExtractionPort（推理模型） · ConsolidationPort</text>
<text x="1045.0" y="453.9" text-anchor="middle" font-size="10" fill="#6b7280">DecayPolicy · RetentionPolicy · PromotionRule</text>
<text x="400.0" y="533.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">晋升桥闸门（私有经验 → 共享知识）</text>
<text x="400.0" y="548.6" text-anchor="middle" font-size="10" fill="#6b7280">触发：DISTILLED 单元跨 ≥N 个 agent/user 被召回，采纳率 &gt; 阈值，纠正率 &lt; 阈值</text>
<text x="400.0" y="563.6" text-anchor="middle" font-size="10" fill="#6b7280">动作：生成 origin=DISTILLED, scope=project/workspace 候选知识单元</text>
<text x="400.0" y="578.6" text-anchor="middle" font-size="10" fill="#6b7280">治理：必须过审核闸门（人审或双模型互检），带 authority 标记发布</text>
<text x="1015.0" y="533.6" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827">知识工程 侧接收（同一 ContextUnit 存储）</text>
<text x="1015.0" y="548.6" text-anchor="middle" font-size="10" fill="#6b7280">调和：与既有知识做冲突检测</text>
<text x="1015.0" y="563.6" text-anchor="middle" font-size="10" fill="#6b7280">发布：走知识审核档，不绕过审核</text>
<text x="1015.0" y="578.6" text-anchor="middle" font-size="10" fill="#6b7280">降权反向：知识被纠正 → 回写 记忆工程 权重</text>
<text transform="rotate(-90 22 470)" x="22" y="470" text-anchor="middle" font-size="10.5" fill="#0d9488">晋升判定</text>
<text x="700" y="656" text-anchor="start" font-size="11" font-weight="400" fill="#6b7280">现状修复：MemoryEvolutionService:81 的 substring(0,30) 字符串拼接 → 模型蒸馏</text>
<text x="700" y="676" text-anchor="start" font-size="11" font-weight="400" fill="#6b7280">现状修复：importance 不再靠 accessCount&gt;3 硬编码 → economy 采纳/纠正信号</text>
<text x="700" y="696" text-anchor="start" font-size="11" font-weight="400" fill="#6b7280">保留正确决策：PROCEDURAL 不参与遗忘（同文件:37），技能只降权不删</text>
