<text x="40" y="42" font-size="19" font-weight="700" fill="#111827">记忆工程模块架构图 —— 六段式管线（写入是决策，不是 append）</text>
<text x="40" y="64" font-size="12.5" fill="#6b7280">记忆抽取的 ADD/UPDATE/DELETE/NOOP 是核心；用模型蒸馏替换现状 substring 拼接实现；程序性记忆只降权不删</text>
